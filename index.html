<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АвтоМастер PRO - Профессиональный автосервис</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 107, 0, 0.2);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ff6b00;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ff6b00;
        }

        /* HERO */
        .hero {
            height: 100vh;
            background: linear-gradient(135deg, rgba(10,10,10,0.8), rgba(10,10,10,0.6)), 
                        url('images/hero.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            padding: 0 20px;
            animation: fadeInUp 1s ease-out;
        }

        .hero h1 {
            font-size: 72px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.3;
            color: #ffa500;
            text-shadow:
                0 0 5px rgba(255, 165, 0, 1),
                0 0 15px rgba(255, 140, 0, 0.9),
                0 0 30px rgba(255, 107, 0, 0.7),
                0 0 60px rgba(255, 107, 0, 0.5),
                0 0 100px rgba(255, 80, 0, 0.3);
        }

        .hero p {
            font-size: 24px;
            margin-bottom: 40px;
            color: #ccc;
        }

        .btn {
            display: inline-block;
            padding: 18px 45px;
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 18px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.4);
        }

        /* SECTIONS */
        section {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            font-size: 48px;
            text-align: center;
            margin-bottom: 60px;
            color: #ff6b00;
        }

        /* SERVICES */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 107, 0, 0.2);
            transition: transform 0.3s, border-color 0.3s;
        }

        .service-card:hover {
            transform: translateY(-10px);
            border-color: #ff6b00;
        }

        .service-icon {
            font-size: 48px;
            color: #ff6b00;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        /* PRICING */
        .pricing-table {
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
        }

        .pricing-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            padding: 25px 40px;
            border-bottom: 1px solid #2a2a2a;
            transition: background 0.3s;
        }

        .pricing-row:hover {
            background: #252525;
        }

        .pricing-row:last-child {
            border-bottom: none;
        }

        .price {
            color: #ff6b00;
            font-weight: 800;
            font-size: 20px;
        }

        /* GALLERY */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* TEAM */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .team-card {
            text-align: center;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
        }

        .team-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #ff6b00;
        }

        .team-card h3 {
            margin-bottom: 5px;
        }

        .team-card p {
            margin-bottom: 5px;
        }

        /* CONTACT */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .contact-item i {
            font-size: 30px;
            color: #ff6b00;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b00;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* FAQ */
        .faq-item {
            background: #1a1a1a;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .faq-question {
            padding: 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .faq-question:hover {
            background: #252525;
        }

        .faq-answer {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s, padding 0.3s;
        }

        .faq-item.active .faq-answer {
            padding: 0 25px 25px;
            max-height: 500px;
        }

        .faq-item.active .faq-question i {
            transform: rotate(180deg);
        }

        /* STATS */
        .stats {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            padding: 80px 20px;
            margin: 100px 0;
        }

        .stats-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .stat-number {
            font-size: 64px;
